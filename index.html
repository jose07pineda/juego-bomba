<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Mazmorra Maldita</title>
<!-- Fuentes de terror (si no hay internet, se usan las de respaldo) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  :root {
    --sangre: #b3121a;
    --sangre-osc: #5a0d10;
    --sangre-viva: #ff2b2b;
    --calabaza: #ff7a1a;
    --hueso: #e8dcc8;
    --oro: #d4a73a;
    --piedra: #17110f;
    --piedra-clara: #231a17;
    --verde: #4caf6a;
    --morado: #8a2be2;
    --titulo: "Creepster", "Chiller", "Impact", fantasy;
    --corr: 0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Special Elite", Georgia, "Times New Roman", serif;
    color: var(--hueso);
    background-color: #0a0607;
    background-image:
      linear-gradient(rgba(0,0,0,.6) 3px, transparent 3px),
      linear-gradient(90deg, rgba(0,0,0,.6) 3px, transparent 3px),
      radial-gradient(ellipse at 50% 120%, rgba(120,10,10,.28), transparent 60%);
    background-size: 140px 70px, 140px 70px, 100% 100%;
    overflow-x: hidden;
  }
  body::before {
    content: "";
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at center, transparent 25%, rgba(0,0,0,.92) 100%);
    pointer-events: none;
    z-index: 1;
  }
  body::after {
    content: "";
    position: fixed; inset: 0;
    background: #000;
    opacity: 0;
    pointer-events: none;
    z-index: 40;
    animation: luzFalla 11s infinite;
  }
  @keyframes luzFalla {
    0%, 90%, 92%, 95%, 100% { opacity: 0; }
    91% { opacity: .75; }
    93% { opacity: .55; }
    94% { opacity: .9; }
  }
  body.jefe, body.puerta { background-color: #1a0305; }
  body.jefe::before, body.puerta::before { background: radial-gradient(ellipse at center, rgba(160,0,0,.22) 15%, rgba(0,0,0,.95) 100%); animation: pulsoJefe 2.2s infinite; }
  @keyframes pulsoJefe { 50% { opacity: .7; } }

  /* ---------- Ambiente ---------- */
  #ambiente { position: fixed; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
  .gota {
    position: absolute; top: -30px;
    width: 8px; height: 14px;
    background: radial-gradient(circle at 35% 30%, #e0242c, #7a060c);
    border-radius: 50% 50% 50% 50% / 65% 65% 35% 35%;
    opacity: .75;
    animation: caer linear infinite;
  }
  @keyframes caer { to { transform: translateY(108vh); } }
  .ojos { position: absolute; display: flex; gap: 12px; opacity: 0; animation: ojosAparecen 8s infinite; }
  .ojos i {
    width: 15px; height: 7px; border-radius: 50%;
    background: radial-gradient(circle, #ff5a5a 0%, var(--sangre-viva) 45%, #700 100%);
    box-shadow: 0 0 12px 3px rgba(255,40,40,.8);
    transform: rotate(8deg);
  }
  .ojos i:last-child { transform: rotate(-8deg); }
  @keyframes ojosAparecen {
    0%, 38% { opacity: 0; transform: scaleY(1); }
    42%, 52% { opacity: 1; transform: scaleY(1); }
    47% { opacity: 1; transform: scaleY(.08); }
    58%, 100% { opacity: 0; }
  }
  .murcielago { position: absolute; left: -70px; font-size: 26px; opacity: .8; animation: volar linear infinite; }
  @keyframes volar {
    0%   { transform: translate(0, 0) scale(1); }
    25%  { transform: translate(28vw, -40px) scale(1.2); }
    50%  { transform: translate(55vw, 25px) scale(.9); }
    75%  { transform: translate(82vw, -30px) scale(1.15); }
    100% { transform: translate(115vw, 10px) scale(1); }
  }
  .tela { position: fixed; font-size: 110px; opacity: .22; z-index: 1; pointer-events: none; filter: grayscale(1); }
  .tela.a { top: -14px; left: -10px; }
  .tela.b { top: -14px; right: -10px; transform: scaleX(-1); }
  .antorcha {
    position: fixed; top: 40%;
    font-size: 54px;
    animation: parpadeo 1s infinite alternate;
    filter: drop-shadow(0 0 24px #ff5a00) hue-rotate(-12deg);
    z-index: 1;
  }
  .antorcha.izq { left: 3vw; }
  .antorcha.der { right: 3vw; }
  @keyframes parpadeo {
    0%   { transform: scale(1) rotate(-4deg); opacity: .75; }
    100% { transform: scale(1.14) rotate(4deg); opacity: 1; }
  }
  @media (max-width: 760px) { .antorcha { display: none; } .tela { font-size: 70px; } }

  #niebla { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
  #niebla::before, #niebla::after {
    content: ""; position: absolute; inset: -20%;
    background:
      radial-gradient(ellipse at 20% 85%, rgba(210,195,195,.10), transparent 50%),
      radial-gradient(ellipse at 75% 95%, rgba(210,195,195,.09), transparent 55%),
      radial-gradient(ellipse at 50% 60%, rgba(160,140,160,.05), transparent 60%);
    animation: nieblaMover 38s ease-in-out infinite alternate;
  }
  #niebla::after { animation-duration: 55s; animation-direction: alternate-reverse; opacity: .8; }
  @keyframes nieblaMover { from { transform: translateX(-9%) translateY(2%); } to { transform: translateX(9%) translateY(-3%); } }

  #linterna {
    position: fixed; inset: 0; z-index: 3; pointer-events: none;
    background: radial-gradient(circle 680px at var(--lx, 50%) var(--ly, 40%), transparent 0%, rgba(0,0,0,.42) 100%);
  }
  @media (pointer: coarse) { #linterna { display: none; } }

  /* ---------- CORRUPCIÓN DE LA MAZMORRA ---------- */
  #app { filter: hue-rotate(calc(var(--corr) * -22deg)) saturate(calc(1 + var(--corr) * .5)); }
  #corrupcion {
    position: fixed; inset: 0; z-index: 5; pointer-events: none;
    opacity: calc(var(--corr) * .6);
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.38) 0 1px, transparent 1px 4px),
      radial-gradient(circle at 30% 20%, rgba(120,0,170,.28), transparent 42%),
      radial-gradient(circle at 80% 70%, rgba(255,0,0,.22), transparent 46%);
    animation: ruido .4s steps(3) infinite;
  }
  @keyframes ruido { 0% { transform: translateY(0); } 33% { transform: translateY(-3px); } 66% { transform: translateY(2px); } 100% { transform: translateY(0); } }
  #grietas {
    position: fixed; inset: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none;
    opacity: 0; transition: opacity 1.5s;
    filter: drop-shadow(0 0 4px #f00);
  }
  body[data-etapa="2"] #grietas { opacity: .55; }
  body[data-etapa="3"] #grietas { opacity: .95; }
  body:not([data-etapa="0"]) .tarjeta h1,
  body:not([data-etapa="0"]) .encabezado-nivel {
    text-shadow:
      0 0 18px rgba(255,43,43,.6),
      3px 3px 0 #2a0305,
      calc(var(--corr) * 6px) 0 rgba(0,255,255,.5),
      calc(var(--corr) * -6px) 0 rgba(255,0,200,.5);
  }
  body[data-etapa="2"] .tarjeta h1, body[data-etapa="3"] .tarjeta h1 { animation-duration: 1.3s; }
  body.glitch #app { animation: glitchApp .3s steps(2) 1; }
  @keyframes glitchApp {
    0%   { transform: translate(0); clip-path: inset(0 0 0 0); }
    20%  { transform: translate(-9px, 2px) skewX(6deg); clip-path: inset(10% 0 55% 0); }
    40%  { transform: translate(8px, -3px) skewX(-6deg); clip-path: inset(50% 0 15% 0); filter: hue-rotate(90deg) saturate(2.4); }
    60%  { transform: translate(-4px, 1px); clip-path: inset(0 0 0 0); }
    80%  { transform: translate(6px, 0) skewX(3deg); clip-path: inset(25% 0 30% 0); }
    100% { transform: none; clip-path: inset(0 0 0 0); }
  }

  /* Fuego del infierno (corrupción alta, puerta y jefe) */
  #infierno {
    position: fixed; left: 0; right: 0; bottom: 0; height: 150px; z-index: 1; pointer-events: none;
    opacity: 0; transition: opacity 2s;
    background: linear-gradient(to top, rgba(255,70,0,.55), rgba(180,0,0,.25) 45%, transparent);
    display: flex; justify-content: space-around; align-items: flex-end; overflow: hidden;
  }
  body[data-etapa="3"] #infierno, body.jefe #infierno, body.puerta #infierno { opacity: 1; }
  .llama { font-size: 54px; transform-origin: bottom center; filter: drop-shadow(0 0 12px #ff5a00); animation: llamear .7s infinite alternate ease-in-out; }
  @keyframes llamear {
    from { transform: scaleY(.85) scaleX(.95) rotate(-3deg); }
    to   { transform: scaleY(1.25) scaleX(1.05) rotate(3deg); }
  }

  #app {
    position: relative; z-index: 2;
    max-width: 780px;
    margin: 0 auto;
    padding: 16px 14px 76px;
    min-height: 100%;
  }

  /* ---------- HUD ---------- */
  #hud {
    display: flex; flex-direction: column; gap: 8px;
    background: rgba(12,7,8,.92);
    border: 2px solid var(--sangre-osc);
    border-radius: 12px;
    padding: 10px 14px;
    margin-bottom: 16px;
    box-shadow: 0 4px 22px rgba(0,0,0,.8), 0 0 18px rgba(179,18,26,.25);
  }
  #hud[hidden] { display: none; }
  .hud-fila { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .progreso { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .punto {
    width: 30px; height: 30px; border-radius: 50%;
    display: grid; place-items: center;
    font-size: 14px; font-weight: bold;
    background: #261a1a; color: #6d5a5a;
    border: 2px solid #3a2626;
  }
  .punto.actual { background: var(--calabaza); color: #2a0e00; border-color: #ffd0a0; box-shadow: 0 0 14px var(--calabaza); }
  .punto.hecho { background: #3b1a1c; color: #c9a9a9; border-color: var(--sangre); }
  .punto.llave, .punto.jefe-punto { font-size: 17px; background: #1c1313; }
  .punto.llave.tiene { background: var(--oro); box-shadow: 0 0 16px var(--oro); }
  .punto.jefe-punto.actual { background: var(--sangre); border-color: #ff9a9a; box-shadow: 0 0 16px var(--sangre-viva); }
  .vidas { font-size: 24px; letter-spacing: 3px; white-space: nowrap; position: relative; }
  .vida { display: inline-block; }
  .vida.recien { animation: romperVida 1s; }
  @keyframes romperVida {
    0%   { transform: scale(2.4) rotate(0); filter: brightness(3) drop-shadow(0 0 14px red); }
    25%  { transform: scale(1.4) rotate(-28deg); }
    50%  { transform: scale(1.5) rotate(28deg); }
    100% { transform: scale(1) rotate(0); filter: none; }
  }
  .menos-uno {
    position: absolute; right: 0; top: 26px;
    font-family: var(--titulo); letter-spacing: 1px; font-size: 32px;
    color: var(--sangre-viva); text-shadow: 0 0 12px #f00;
    animation: bajarMenos 1.2s forwards; pointer-events: none; white-space: nowrap;
  }
  @keyframes bajarMenos { from { transform: translateY(0); opacity: 1; } to { transform: translateY(40px); opacity: 0; } }
  #btn-sonido {
    background: none; border: 2px solid var(--sangre-osc); color: var(--hueso);
    border-radius: 8px; padding: 4px 8px; font-size: 18px; cursor: pointer;
  }
  .hud-fila2 { border-top: 1px dashed rgba(179,18,26,.35); padding-top: 8px; }
  .corr-wrap { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .corr-bar { width: 120px; height: 12px; background: #060303; border: 2px solid #4a1a5a; border-radius: 8px; overflow: hidden; }
  #corr-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--morado), var(--sangre-viva)); transition: width .6s; }
  #corr-etapa { font-size: 13px; color: #c9a0ff; min-width: 74px; }
  .codigo-hud { display: flex; align-items: center; gap: 5px; }
  .codigo-etiqueta { font-size: 13px; color: var(--oro); margin-right: 3px; }
  .slot {
    width: 24px; height: 30px; display: grid; place-items: center;
    background: #120c0c; border: 2px solid #5c4a1a; border-radius: 6px;
    font-family: "Courier New", monospace; font-size: 17px; color: #6d5a5a;
  }
  .slot.lleno { color: #ffe27a; border-color: var(--oro); box-shadow: 0 0 8px rgba(212,167,58,.6); }

  /* ---------- Tarjetas y botones ---------- */
  .tarjeta {
    position: relative;
    background: linear-gradient(180deg, var(--piedra-clara), var(--piedra) 70%, #0d0808);
    border: 3px solid var(--sangre-osc);
    border-radius: 14px;
    padding: 30px 22px 26px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,.85), 0 0 30px rgba(179,18,26,.3), inset 0 0 50px rgba(0,0,0,.65);
    animation: aparecer .6s ease;
  }
  .tarjeta::before {
    content: "";
    position: absolute; left: -3px; right: -3px; top: -3px; height: 38px;
    background:
      radial-gradient(circle at 8%  100%, var(--sangre) 0 9px, transparent 10px),
      radial-gradient(circle at 23% 100%, var(--sangre) 0 7px, transparent 8px),
      radial-gradient(circle at 41% 100%, var(--sangre) 0 11px, transparent 12px),
      radial-gradient(circle at 58% 100%, var(--sangre) 0 8px, transparent 9px),
      radial-gradient(circle at 77% 100%, var(--sangre) 0 10px, transparent 11px),
      radial-gradient(circle at 92% 100%, var(--sangre) 0 7px, transparent 8px),
      linear-gradient(var(--sangre), var(--sangre)) top / 100% 12px no-repeat;
    border-radius: 12px 12px 0 0;
    pointer-events: none;
  }
  @keyframes aparecer {
    0% { opacity: 0; transform: translateY(16px) scale(.97); filter: blur(4px); }
    100% { opacity: 1; transform: none; filter: none; }
  }
  .tarjeta h1 {
    font-family: var(--titulo); font-weight: normal; letter-spacing: 2px;
    font-size: clamp(36px, 7vw, 58px);
    color: var(--sangre-viva);
    text-shadow: 0 0 18px rgba(255,43,43,.6), 3px 3px 0 #2a0305;
    margin: 8px 0 10px;
    animation: temblar 3.4s infinite;
  }
  @keyframes temblar {
    0%, 92%, 100% { transform: translate(0); }
    93% { transform: translate(-3px, 1px) skewX(4deg); }
    95% { transform: translate(3px, -1px) skewX(-4deg); }
    97% { transform: translate(-2px, 0); }
  }
  .tarjeta h2 { font-family: var(--titulo); font-weight: normal; letter-spacing: 2px; font-size: 26px; color: var(--calabaza); margin-bottom: 4px; text-shadow: 0 0 12px rgba(255,122,26,.45); }
  .tarjeta p { line-height: 1.55; margin: 8px 0; font-size: 18px; }
  .grande { font-size: 80px; margin: 6px 0; filter: drop-shadow(0 0 18px rgba(255,43,43,.55)); animation: flotar 3s infinite ease-in-out; }
  @keyframes flotar { 50% { transform: translateY(-8px) rotate(3deg); } }
  .reglas { text-align: left; max-width: 560px; margin: 14px auto; list-style: none; }
  .reglas li { padding: 6px 0; font-size: 16px; line-height: 1.4; border-bottom: 1px dashed rgba(179,18,26,.3); }
  .datos { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin: 14px 0; }
  .dato { background: rgba(0,0,0,.5); border: 1px solid var(--sangre-osc); border-radius: 8px; padding: 8px 14px; font-size: 16px; }
  .nota-corr {
    border: 1px dashed var(--morado); background: rgba(60,0,80,.28);
    border-radius: 8px; padding: 8px 12px; margin: 10px auto; max-width: 560px;
    font-size: 15px; line-height: 1.45; color: #e2c4ff;
  }
  .admin-cita {
    max-width: 560px; margin: 10px auto; padding: 8px 12px;
    font-family: "Courier New", monospace; font-size: 14px; text-align: left;
    color: #ff9ad5; background: rgba(0,0,0,.45); border-left: 3px solid var(--sangre);
  }

  .btn {
    margin-top: 16px;
    font-family: var(--titulo); letter-spacing: 2px; font-size: 26px;
    padding: 10px 32px;
    color: var(--hueso);
    background: linear-gradient(180deg, #c4161f, #6b0a10);
    border: 3px solid #1a0204;
    outline: 2px solid var(--sangre);
    border-radius: 10px;
    cursor: pointer;
    text-shadow: 2px 2px 0 #1a0204;
    box-shadow: 0 5px 0 #2c0408, 0 0 22px rgba(255,43,43,.4);
    transition: transform .08s, box-shadow .08s, filter .15s;
  }
  .btn:hover { transform: translateY(-2px); filter: brightness(1.2); box-shadow: 0 7px 0 #2c0408, 0 0 32px rgba(255,43,43,.7); }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #2c0408; }
  .btn-mini {
    font-family: inherit; font-size: 15px; padding: 8px 14px; margin-top: 10px;
    color: #d9b8ff; background: #1a0f22; border: 2px dashed #6a3a8a; border-radius: 8px; cursor: pointer;
  }
  .btn-mini:hover:not(:disabled) { background: #28163a; border-color: #b57aff; }
  .btn-mini:disabled { opacity: .4; cursor: default; }

  /* ---------- Zona de juego ---------- */
  .juego { text-align: center; }
  .encabezado-nivel { font-family: var(--titulo); letter-spacing: 2px; font-size: 28px; color: var(--calabaza); text-shadow: 0 0 14px rgba(255,122,26,.5); }
  .tema-nivel { font-size: 15px; color: #b99d96; margin-bottom: 4px; }
  .jefe .encabezado-nivel { color: var(--sangre-viva); text-shadow: 0 0 16px rgba(255,43,43,.7); }
  .zona-bomba { position: relative; display: flex; align-items: center; justify-content: center; gap: 22px; flex-wrap: wrap; margin: 6px 0 10px; }
  #bomba { width: 160px; height: 160px; overflow: visible; filter: drop-shadow(0 0 12px rgba(179,18,26,.6)); }
  #bomba .ojo-b { fill: #8a1218; filter: drop-shadow(0 0 3px #ff2b2b); }
  #bomba.peligro { animation: latido .55s infinite; filter: drop-shadow(0 0 22px var(--sangre-viva)); }
  #bomba.peligro .ojo-b { fill: var(--sangre-viva); filter: drop-shadow(0 0 8px #ff0000); }
  @keyframes latido { 50% { transform: scale(1.12) rotate(-2deg); } }
  #bomba.enojada { animation: bombaEnojada .5s; }
  #bomba.enojada .ojo-b { fill: var(--sangre-viva); filter: drop-shadow(0 0 10px #ff0000); }
  @keyframes bombaEnojada {
    0%, 100% { transform: scale(1); }
    20% { transform: scale(1.25) rotate(-8deg); }
    40% { transform: scale(1.2) rotate(8deg); }
    60% { transform: scale(1.25) rotate(-6deg); }
    80% { transform: scale(1.15) rotate(4deg); }
  }
  #chispa { animation: chispa .12s infinite alternate; }
  @keyframes chispa { to { opacity: .5; } }

  .reloj { min-width: 220px; }
  #tiempo, #t-puerta {
    font-family: var(--titulo); letter-spacing: 3px;
    font-size: 68px; font-variant-numeric: tabular-nums;
    position: relative; display: inline-block;
    color: var(--hueso);
    text-shadow: 0 0 14px rgba(255,255,255,.25);
  }
  #tiempo.rojo, #t-puerta.rojo { color: var(--sangre-viva); text-shadow: 0 0 22px var(--sangre-viva); animation: temblar 0.6s infinite; }
  .barra { height: 14px; background: #060303; border: 2px solid var(--sangre-osc); border-radius: 10px; overflow: hidden; margin-top: 2px; }
  #barra-tiempo, #barra-puerta { height: 100%; width: 100%; background: linear-gradient(90deg, #ff9a3c, var(--calabaza)); transition: width .1s linear; }
  #barra-tiempo.rojo, #barra-puerta.rojo { background: linear-gradient(90deg, #ff4b4b, #a00); }

  .jefe-info { margin: 4px 0 10px; }
  .jefe-emoji { font-size: 70px; display: inline-block; filter: drop-shadow(0 0 20px var(--sangre-viva)); animation: respirar 1.8s infinite ease-in-out; }
  .jefe-emoji.golpe { animation: golpe .45s; }
  @keyframes respirar { 50% { transform: scale(1.1); } }
  @keyframes golpe { 30% { transform: translateX(-14px) rotate(-8deg); filter: brightness(3); } 70% { transform: translateX(14px) rotate(8deg); } }
  .jefe-nombre { font-family: var(--titulo); letter-spacing: 2px; font-size: 20px; color: #ff8d86; margin-bottom: 4px; }
  .vida-jefe { max-width: 320px; margin: 0 auto; height: 16px; background: #060303; border: 2px solid var(--sangre); border-radius: 10px; overflow: hidden; }
  #hp-jefe { height: 100%; width: 100%; background: linear-gradient(90deg, #ff4b4b, #7a0000); transition: width .5s; }

  .caja-pregunta {
    background: rgba(0,0,0,.55);
    border: 2px solid var(--sangre-osc);
    border-radius: 12px;
    padding: 18px 16px 20px;
    box-shadow: inset 0 0 30px rgba(0,0,0,.7);
  }
  .caja-pregunta.llave { border-color: var(--oro); box-shadow: inset 0 0 30px rgba(0,0,0,.7), 0 0 22px rgba(212,167,58,.4); }
  .insignia-llave {
    display: inline-block; background: var(--oro); color: #2a1d05;
    padding: 3px 14px; border-radius: 20px; font-size: 14px; font-weight: bold; margin-bottom: 8px;
    animation: pulsoOro 1.4s infinite alternate;
  }
  @keyframes pulsoOro { from { box-shadow: 0 0 6px var(--oro); } to { box-shadow: 0 0 22px #ffe27a; } }
  .pregunta-num { color: #a88f88; font-size: 14px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 6px; }
  .pregunta { font-size: clamp(19px, 3.5vw, 25px); line-height: 1.35; margin-bottom: 16px; color: var(--hueso) !important; font-weight: normal; animation: preguntaEntra .5s ease; }
  @keyframes preguntaEntra {
    from { opacity: 0; filter: blur(6px); transform: translateY(8px) skewX(-3deg); }
    to   { opacity: 1; filter: none; transform: none; }
  }

function activar(id, ms) {
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.remove("activo"); void el.offsetWidth; el.classList.add("activo");
  setTimeout(() => el.classList.remove("activo"), ms);
}

function centroDe(el) {
  const r = el.getBoundingClientRect();
  return [r.left + r.width / 2, r.top + r.height / 2];
}

function sacudirPantalla() {
  document.body.classList.add("sacudir");
  setTimeout(() => document.body.classList.remove("sacudir"), 600);
}

function particulas(x, y, emojis, cantidad = 14, distancia = 150) {
  for (let i = 0; i < cantidad; i++) {
    const p = document.createElement("span");
    p.className = "particula";
    p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    const ang = Math.random() * Math.PI * 2;
    const dist = distancia * (0.4 + Math.random() * 0.8);
    p.style.left = x + "px";
    p.style.top = y + "px";
    p.style.setProperty("--dx", Math.cos(ang) * dist + "px");
    p.style.setProperty("--dy", Math.sin(ang) * dist + "px");
    p.style.setProperty("--rot", (Math.random() * 720 - 360) + "deg");
    p.style.fontSize = (16 + Math.random() * 20) + "px";
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 1100);
  }
}

/* ---------- Glitch (la mazmorra se descompone) ---------- */
function glitchearTexto() {
  const objetivos = document.querySelectorAll(".pregunta, .tarjeta h1, .encabezado-nivel");
  if (!objetivos.length) return;
  const el = objetivos[Math.floor(Math.random() * objetivos.length)];
  const original = el.textContent;
  const simbolos = "█▓▒░#@$%&!?<>/\\01";
  const roto = original.split("").map(ch =>
    (ch !== " " && Math.random() < 0.3) ? simbolos[Math.floor(Math.random() * simbolos.length)] : ch
  ).join("");
  el.textContent = roto;
  setTimeout(() => { if (document.body.contains(el)) el.textContent = original; }, 200);
}

function glitchRafaga(conSonido) {
  document.body.classList.remove("glitch"); void document.body.offsetWidth;
  document.body.classList.add("glitch");
  setTimeout(() => document.body.classList.remove("glitch"), 320);
  glitchearTexto();
  if (conSonido) sonidoCorrupcion();
}

    programarGlitch();

}

  const antes = etapaDe(estado.corrupcion);
  estado.corrupcion = Math.min(100, estado.corrupcion + cantidad);
  log("WARN", `☣ corrupción +${cantidad}% (${motivo}) → ${estado.corrupcion}%`);
  aplicarCorrupcion();
  glitchRafaga(true);
  const despues = etapaDe(estado.corrupcion);
  if (despues > antes) {
    decir(ADMIN.etapa[despues], 6000);
    sacudirPantalla();
    activar("rayo", 700);
  }
}

function mezclar(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {

    [a[i], a[j]] = [a[j], a[i]];

function formatear(seg) {
  return Math.max(0, Math.ceil(seg));
}

// Conteo de la bomba en minutos:segundos (ej. 300 → 5:00)
function formatearMinutos(seg) {
  const s = Math.max(0, Math.ceil(seg));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}

// Texto de la duración para las tarjetas (ej. 300 → "5 minutos")
function textoDuracion(seg) {
  if (seg < 60) return seg + " segundos";
  const m = Math.floor(seg / 60);
  const s = seg % 60;
  return m + (m === 1 ? " minuto" : " minutos") + (s ? " " + s + " s" : "");
}

/* ---------- Sonido (generado con Web Audio, sin archivos) ---------- */
let audioCtx = null;
function tono(freq, dur = 0.12, tipo = "square", vol = 0.06, retraso = 0) {
  if (!sonidoActivo) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = tipo; o.frequency.value = freq;
    const t0 = audioCtx.currentTime + retraso;
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t0); o.stop(t0 + dur);
  } catch (e) { /* sin audio, no pasa nada */ }
}
function barrido(f1, f2, dur = 0.5, tipo = "sawtooth", vol = 0.12) {
  if (!sonidoActivo) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = tipo;
    const t0 = audioCtx.currentTime;
    o.frequency.setValueAtTime(f1, t0);
    o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t0); o.stop(t0 + dur);
  } catch (e) { /* sin audio */ }
}

   ===================================================================== */
function actualizarHUD() {
  $hud.hidden = false;
  let html = "";
  for (let i = 0; i < NIVELES.length; i++) {
    const hecho = estado.enJefe || i < estado.fragmentos;
    let clase = "punto";
    if (!estado.enJefe && !hecho && i === estado.nivel) clase += " actual";
    else if (hecho) clase += " hecho";
    html += `<div class="${clase}" title="Sala ${i + 1}">${hecho ? "✓" : i + 1}</div>`;
  }
  html += `<div class="punto llave ${estado.tieneLlave ? "tiene" : ""}" title="Llave del jefe">${estado.tieneLlave ? "🗝️" : "🔒"}</div>`;
  html += `<div class="punto jefe-punto ${estado.enJefe ? "actual" : ""}" title="Puerta del Infierno">👹</div>`;
  document.getElementById("progreso").innerHTML = html;

  let vidas = "";
  for (let i = 0; i < VIDAS_INICIALES; i++) {
    const viva = i < estado.vidas;
    const recien = !viva && i < vidasMostradas;   // la que acaba de perderse
    vidas += `<span class="vida ${recien ? "recien" : ""}">${viva ? "🎃" : "💀"}</span>`;
  }
  document.getElementById("vidas").innerHTML = vidas;
  vidasMostradas = estado.vidas;

  let slots = '<span class="codigo-etiqueta">🗝️ Código</span>';
  for (let i = 0; i < LARGO_CODIGO; i++) {
    const tiene = i < estado.fragmentos;
    const txt = tiene ? (estado.ocultarCodigo ? "▓" : estado.codigo[i]) : "·";
    slots += `<span class="slot ${tiene ? "lleno" : ""}">${txt}</span>`;
  }
  document.getElementById("codigo-hud").innerHTML = slots;
}

      <div class="dato">🏆 Victorias: ${reg.victorias || 0}</div>
      ${reg.mejorCorrupcion != null ? `<div class="dato">☣️ Mejor corrupción: ${reg.mejorCorrupcion}%</div>` : ""}
    </div>` : "";
  mostrar(`
    <section class="tarjeta">
      <div class="grande">💣</div>
      <h1>La Mazmorra Maldita</h1>
      <div class="admin-cita">[ADMIN@mazmorra ~]$ Yo construí este lugar. Cada sala, cada pregunta, cada bug.</div>
      <p>Cruza 5 salas que mezclan <b>Halloween</b>, <b>historia</b>, <b>inteligencia artificial</b> y <b>análisis de software</b> antes de que la bomba explote.</p>
      <ul class="reglas">
        <li>⏳ Cada sala tiene un <b>límite de tiempo</b>. Cada vez es más difícil.</li>
        <li>🎃 Tienes <b>${VIDAS_INICIALES} vidas</b>. Cada <b>respuesta incorrecta</b> te quita ${VIDAS_POR_ERROR}.</li>
        <li>💣 Si se acaba el tiempo, la bomba explota: pierdes <b>otra vida</b> y la <b>sala se reinicia</b> desde la primera pregunta.</li>
        <li>☣️ Cada error y cada bomba <b>corrompen la mazmorra</b>: glitches, grietas y fuego. La corrupción <b>nunca baja</b>.</li>
        <li>🗝️ La última pregunta de cada sala es la <b>Pregunta de la Llave</b>: revela un dígito del <b>código secreto</b> (${LARGO_CODIGO} dígitos en total).</li>
        <li>🚪 Con el código abres la <b>Puerta del Infierno</b>: debes teclearlo a tiempo y de memoria. Cuanto más corrupta esté la mazmorra, <b>más difícil será al otro lado</b> (más preguntas y menos tiempo).</li>
        <li>🔦 Comodines en las salas: <b>50/50</b> y <b>+${SEGUNDOS_EXTRA_COMODIN} s</b>. Son pactos con la oscuridad: <b>corrompen</b>.</li>
        <li>🏆 Derrota a la puerta y gana el trofeo con las <b>2 piezas del rompecabezas</b>.</li>
      </ul>
      ${registro}
      <button class="btn" id="btn-empezar">☠️ Entrar a la mazmorra</button>
    </section>
  `);
  document.getElementById("btn-empezar").onclick = () => {
    reiniciarEstado();
    pantallaIntro(NIVELES[0], false);
  };
  decir(azar(ADMIN.inicio));
}

function reiniciarEstado() {
  estado.vidas = VIDAS_INICIALES;
  estado.nivel = 0;
  estado.explosiones = 0;
  estado.errores = 0;
  estado.corrupcion = 0;
  estado.fragmentos = 0;
  estado.tieneLlave = false;
  estado.enJefe = false;
  estado.ocultarCodigo = false;
  estado.codigo = Array.from({ length: LARGO_CODIGO }, () => Math.floor(Math.random() * 10)).join("");
  vidasMostradas = VIDAS_INICIALES;
  aplicarCorrupcion();
  const reg = cargarRegistro();
  reg.intentos = (reg.intentos || 0) + 1;
  guardarRegistro(reg);
  log("INFO", "nueva partida · código secreto generado (cifrado)");
}

/* La puerta final se endurece según la corrupción */
function prepararJefe() {
  const c = estado.corrupcion;
  const extras = Math.min(JEFE_EXTRA.length, Math.floor(c / CORRUPCION_POR_PREGUNTA_EXTRA));
  const menos = Math.round(c * SEGUNDOS_MENOS_POR_PUNTO);
  const tiempo = Math.max(TIEMPO_MINIMO_JEFE, JEFE.tiempo - menos);
  return { ...JEFE, tiempo, extras, menos: JEFE.tiempo - tiempo, preguntas: JEFE.preguntas.concat(JEFE_EXTRA.slice(0, extras)) };
}

function textoNotaJefe(def) {
  const pregs = def.extras > 0 ? `<b>+${def.extras} pregunta${def.extras > 1 ? "s" : ""}</b>` : "sin preguntas extra";
  const tiempo = def.menos > 0 ? `<b>−${def.menos} s</b> de tiempo` : "sin recorte de tiempo";
  return `☣️ Corrupción ${estado.corrupcion}% (${NOMBRES_ETAPA[etapaDe(estado.corrupcion)]}): ${pregs} y ${tiempo}.`;
}

function pantallaIntro(def, esJefe) {
  pararTemporizador();
  estado.enJefe = esJefe;
  estado.ocultarCodigo = false;
  document.body.classList.toggle("jefe", esJefe);
  document.body.classList.remove("puerta");
  actualizarHUD();
  const titulo = esJefe ? "🔥 EL OTRO LADO DE LA PUERTA 🔥" : `Sala ${estado.nivel + 1} de ${NIVELES.length}`;
  const aviso = esJefe
    ? "Los sellos de la puerta se rompen uno a uno con cada respuesta correcta. Aquí no valen pactos ni comodines. ¡Derrótala antes de que explote la bomba!"
    : "Algo se mueve en la oscuridad. Responde todas las preguntas antes de que se acabe el tiempo. La última es la Pregunta de la Llave.";
  mostrar(`
    <section class="tarjeta">
      <div class="grande">${def.emoji}</div>
      <h2>${titulo}</h2>
      <h1 style="font-size:clamp(30px,6vw,46px)">${def.nombre}</h1>
      <p>${aviso}</p>
      ${esJefe ? `<div class="nota-corr">${textoNotaJefe(def)}</div>` : ""}
      <div class="datos">
        <div class="dato">${def.tema}</div>
        <div class="dato">❓ ${def.preguntas.length} preguntas</div>
        <div class="dato">⏳ ${textoDuracion(def.tiempo)}</div>
        <div class="dato">${"🎃".repeat(estado.vidas)} ${estado.vidas} ${estado.vidas === 1 ? "vida" : "vidas"}</div>
      </div>
      <button class="btn" id="btn-go">💣 ¡Empezar!</button>
    </section>
  `);
  document.getElementById("btn-go").onclick = () => jugar(def, esJefe);
  decir(esJefe ? azar(ADMIN.jefe) : def.admin);
}

/* ---------- Pantalla de juego ---------- */
function jugar(def, esJefe) {
  pararTemporizador();
  const normales = def.preguntas.filter(q => !q.llave);
  const preguntaLlave = def.preguntas.find(q => q.llave);
  const preguntas = mezclar(normales);
  if (preguntaLlave) preguntas.push(preguntaLlave);     // la Pregunta de la Llave va al final
  const total = preguntas.length;
  let duracion = def.tiempo * 1000;
  let fin = Date.now() + duracion;
  let indice = 0;
  let bloqueado = false;
  let ultimoSegundo = null;
  let usado50 = false, usadoTiempo = false;
  let actual = [];
  let fase = 0;

  mostrar(`
    <section class="juego">
      <div class="encabezado-nivel">${esJefe ? "🔥 " + def.nombre : "Sala " + (estado.nivel + 1) + " · " + def.nombre}</div>
      <div class="tema-nivel">${def.tema}</div>
      ${esJefe ? `<div class="jefe-info"><span class="jefe-emoji" id="jefe-emoji">${FASES_JEFE[0].emoji}</span><div class="jefe-nombre" id="jefe-nombre">${FASES_JEFE[0].nombre}</div><div class="vida-jefe"><div id="hp-jefe"></div></div></div>` : ""}
      <div class="zona-bomba">
        <svg id="bomba" viewBox="0 0 200 200">
          <circle cx="95" cy="128" r="62" fill="#131010" stroke="#4a3a3a" stroke-width="4"/>
          <ellipse cx="72" cy="100" rx="14" ry="8" fill="rgba(255,255,255,.14)" transform="rotate(-30 72 100)"/>
          <rect x="78" y="55" width="34" height="20" rx="4" fill="#3a3030"/>
          <path class="ojo-b" d="M60 110 L90 124 L84 136 L60 126 Z"/>
          <path class="ojo-b" d="M130 110 L100 124 L106 136 L130 126 Z"/>
          <path d="M62 152 L72 163 L82 150 L92 163 L102 150 L112 163 L122 150 L132 160" fill="none" stroke="#cfc3ac" stroke-width="3" stroke-linejoin="round"/>
          <path id="mecha" d="M95 55 C95 28, 128 36, 144 14" fill="none" stroke="#b08a52" stroke-width="5" stroke-linecap="round"/>
          <g id="chispa">
            <circle r="11" fill="#ff7a00"/>
            <circle r="5" fill="#fff3b0"/>
          </g>
        </svg>
        <div class="reloj">
          <div id="tiempo">${formatearMinutos(def.tiempo)}</div>
          <div class="barra"><div id="barra-tiempo"></div></div>
        </div>
      </div>
      <div class="caja-pregunta" id="caja"></div>
      ${esJefe
        ? `<div class="sin-pactos">🚫 Los pactos no valen en la puerta del infierno.</div>`
        : `<div class="comodines">
             <button class="btn-mini" id="btn-5050">🔦 50/50 <small>(+${CORRUPCION_5050}% ☣️)</small></button>
             <button class="btn-mini" id="btn-mas-tiempo">⏳ +${SEGUNDOS_EXTRA_COMODIN} s <small>(+${CORRUPCION_TIEMPO}% ☣️)</small></button>
           </div>`}
    </section>
  `);

  const $tiempo = document.getElementById("tiempo");
  const $barra = document.getElementById("barra-tiempo");
  const $bomba = document.getElementById("bomba");
  const $mecha = document.getElementById("mecha");
  const $chispa = document.getElementById("chispa");
  const $caja = document.getElementById("caja");
  const largoMecha = $mecha.getTotalLength();

  function dibujarMecha(fraccion) {
    const f = Math.min(1, Math.max(0, fraccion));
    $mecha.style.strokeDasharray = `${largoMecha * f} ${largoMecha}`;
    const p = $mecha.getPointAtLength(largoMecha * f);
    $chispa.setAttribute("transform", `translate(${p.x} ${p.y})`);
  }

  function mostrarPregunta() {
    const q = preguntas[indice];
    const esLlave = !!q.llave;
    const opciones = mezclar(q.r.map((texto, k) => ({ texto, ok: k === q.c })));
    $caja.classList.toggle("llave", esLlave);
    $caja.innerHTML = `
      ${esLlave ? `<div class="insignia-llave">🗝️ PREGUNTA DE LA LLAVE · dígito ${estado.nivel + 1} de ${NIVELES.length}</div>` : ""}
      <div class="pregunta-num">Pregunta ${indice + 1} de ${total}</div>
      <h2 class="pregunta">${q.p}</h2>
      <div class="opciones"></div>
    `;
    const cont = $caja.querySelector(".opciones");
    actual = opciones.map((op, n) => {
      const b = document.createElement("button");
      b.className = "opcion";
      b.style.setProperty("--i", n);
      b.textContent = `${n + 1}. ${op.texto}`;
      b.dataset.num = n + 1;
      b.onclick = () => responder(b, op.ok);
      cont.appendChild(b);
      return { boton: b, ok: op.ok };
    });
    bloqueado = false;
  }

  function cambiarFase(n) {
    const f = FASES_JEFE[n];
    const je = document.getElementById("jefe-emoji");
    if (je) je.textContent = f.emoji;
    const nm = document.getElementById("jefe-nombre");
    if (nm) nm.textContent = `${f.nombre} · sellos rotos ${n}/3`;
    decir(ADMIN.fases[n - 1]);
    log("WARN", `🔥 sello ${n} de 3 roto`);
    activar("rayo", 700);
    sacudirPantalla();
    sonidoTrueno();
    particulas(innerWidth / 2, innerHeight / 3, ["🔥", "💀", "😈", "🩸"], 30, 300);
  }

  function responder(boton, correcta) {
    if (bloqueado) return;
    if (correcta) {
      bloqueado = true;
      boton.classList.add("bien");
      $caja.querySelectorAll(".opcion").forEach(b => b.disabled = true);
      sonidoBien();
      efectoAcierto(boton, esJefe);
      indice++;
      log("INFO", `test_pregunta_${indice}: PASSED`);
      if (Math.random() < 0.25) decir(azar(ADMIN.acierto));
      if (esJefe) {
        document.getElementById("hp-jefe").style.width = ((total - indice) / total * 100) + "%";
        const je = document.getElementById("jefe-emoji");
        je.classList.remove("golpe"); void je.offsetWidth; je.classList.add("golpe");
        const nuevaFase = Math.min(2, Math.floor(indice / total * 3));
        if (indice < total && nuevaFase !== fase) { fase = nuevaFase; cambiarFase(fase); }
      }
      if (indice >= total) {
        pararTemporizador();
        setTimeout(() => nivelSuperado(def, esJefe), 700);
      } else {
        setTimeout(mostrarPregunta, 550);
      }
    } else {
      boton.classList.add("mal");
      boton.disabled = true;
      sonidoMal();
      // Cada respuesta incorrecta quita vida y corrompe la mazmorra
      estado.vidas = Math.max(0, estado.vidas - VIDAS_POR_ERROR);
      estado.errores++;
      actualizarHUD();
      efectoDano(boton);
      log("ERROR", `RespuestaIncorrectaException en la pregunta ${indice + 1}`);
      $bomba.classList.remove("enojada"); void $bomba.offsetWidth; $bomba.classList.add("enojada");
      setTimeout(() => $bomba.classList.remove("enojada"), 500);
      if (estado.vidas <= 0) {
        bloqueado = true;
        pararTemporizador();
        $caja.querySelectorAll(".opcion").forEach(b => b.disabled = true);
        corromper(CORRUPCION_ERROR, "respuesta incorrecta");
        setTimeout(pantallaGameOver, 1100);
      } else {
        decir(azar(ADMIN.error));
        corromper(CORRUPCION_ERROR, "respuesta incorrecta");
      }
    }
  }

  /* ---------- Comodines (pactos con la oscuridad) ---------- */
  if (!esJefe) {
    const btn50 = document.getElementById("btn-5050");
    const btnTiempo = document.getElementById("btn-mas-tiempo");
    btn50.onclick = () => {
      if (usado50 || bloqueado) return;
      const malas = actual.filter(o => !o.ok && !o.boton.disabled);
      if (malas.length < 2) { decir("No quedan suficientes opciones que descartar."); return; }
      usado50 = true; btn50.disabled = true;
      mezclar(malas).slice(0, 2).forEach(o => { o.boton.disabled = true; o.boton.classList.add("descartada"); });
      log("INFO", "comodín 50/50 activado");
      decir(azar(ADMIN.comodin));
      corromper(CORRUPCION_5050, "pacto: comodín 50/50");
    };
    btnTiempo.onclick = () => {
      if (usadoTiempo || bloqueado) return;
      usadoTiempo = true; btnTiempo.disabled = true;
      fin += SEGUNDOS_EXTRA_COMODIN * 1000;
      duracion += SEGUNDOS_EXTRA_COMODIN * 1000;
      log("INFO", `comodín +${SEGUNDOS_EXTRA_COMODIN}s activado`);
      decir(azar(ADMIN.comodin));
      corromper(CORRUPCION_TIEMPO, "pacto: comodín de tiempo");
      tick();
    };
  }

  function tick() {
    const restante = fin - Date.now();
    const fraccion = restante / duracion;
    $tiempo.textContent = formatearMinutos(restante / 1000);
    $barra.style.width = Math.max(0, fraccion * 100) + "%";
    dibujarMecha(fraccion);
    const peligro = restante <= 10000;
    $tiempo.classList.toggle("rojo", peligro);
    $barra.classList.toggle("rojo", peligro);
    $bomba.classList.toggle("peligro", peligro);
    document.body.classList.toggle("alerta", peligro);
    if (peligro) {
      const seg = Math.ceil(restante / 1000);
      if (seg !== ultimoSegundo && seg > 0) { ultimoSegundo = seg; sonidoTic(); }
    }
    if (restante <= 0) {
      pararTemporizador();
      bloqueado = true;
      explotar({ tipo: esJefe ? "jefe" : "sala", def });
    }
  }

  // Atajos de teclado 1-4
  function teclado(e) {
    if (!document.body.contains($caja)) { document.removeEventListener("keydown", teclado); return; }
    const b = $caja.querySelector(`.opcion[data-num="${e.key}"]`);
    if (b && !b.disabled) b.click();
  }
  document.addEventListener("keydown", teclado);

  mostrarPregunta();
  tick();
  temporizador = setInterval(tick, 100);
}

/* ---------- Explosión ---------- */
function explotar(ctx) {
  estado.vidas = Math.max(0, estado.vidas - 1);
  estado.explosiones++;
  actualizarHUD();
  log("ERROR", "💣 BOOM: la bomba llegó a 0");
  corromper(CORRUPCION_BOMBA, "bomba explotada");
  sonidoExplosion();

  const flash = document.getElementById("flash");
  flash.classList.remove("activo"); void flash.offsetWidth; flash.classList.add("activo");
  document.body.classList.add("sacudir");
  setTimeout(() => { flash.classList.remove("activo"); document.body.classList.remove("sacudir"); }, 1400);

  setTimeout(() => {
    if (estado.vidas <= 0) pantallaGameOver();
    else pantallaExplosion(ctx);
  }, 1300);
}

function pantallaExplosion(ctx) {
  const n = estado.nivel + 1;
  const clase = ctx.tipo === "sala" ? `Sala${n}` : ctx.tipo === "jefe" ? "PuertaDelInfierno" : "CerraduraFinal";
  const linea = 40 + Math.floor(Math.random() * 400);
  const traza =
    `Exception in thread "mazmorra-main" java.lang.TimeoutException: la bomba llegó a 0\n` +
    `    at ${clase}.responder(${clase}.java:${linea})\n` +
    `    at Jugador.pensarDemasiado(Jugador.java:666)\n` +
    `    at Bomba.explotar(Bomba.java:0)\n` +
    `    ... bombas explotadas: ${estado.explosiones} · corrupción: ${estado.corrupcion}%`;
  const accion = ctx.tipo === "sala"
    ? "La sala se <b>reinicia desde la primera pregunta</b>."
    : ctx.tipo === "jefe"
      ? "La puerta se vuelve a sellar y el infierno te espera con <b>más rabia</b>: la corrupción subió."
      : "La cerradura se reinicia: tendrás que <b>volver a teclear el código</b>.";
  const boton = ctx.tipo === "sala" ? "🔁 Reiniciar la sala" : ctx.tipo === "jefe" ? "🔁 Volver a la puerta" : "🔁 Reintentar la cerradura";
  mostrar(`
    <section class="tarjeta">
      <div class="grande">💥</div>
      <h1>¡BOOOM!</h1>
      <p>Se acabó el tiempo, la bomba explotó y la mazmorra te arrebató una vida…</p>
      <pre class="traza">${traza}</pre>
      <p style="font-size:34px">${"🎃".repeat(estado.vidas)}${"💀".repeat(VIDAS_INICIALES - estado.vidas)}</p>
      <p>${estado.vidas === 1 ? "Solo te queda <b>1 vida</b>" : "Te quedan <b>" + estado.vidas + " vidas</b>"}. ${accion}</p>
      <button class="btn" id="btn-reintentar">${boton}</button>
    </section>
  `);
  document.getElementById("btn-reintentar").onclick = () => {
    if (ctx.tipo === "sala") pantallaIntro(ctx.def, false);
    else if (ctx.tipo === "jefe") pantallaIntro(prepararJefe(), true);
    else pantallaPuerta();
  };
  decir(azar(ADMIN.bomba));
}

/* ---------- Avance ---------- */
function nivelSuperado(def, esJefe) {
  if (esJefe) return pantallaVictoria();

  estado.fragmentos = estado.nivel + 1;
  actualizarHUD();
  const digito = estado.codigo[estado.nivel];
  const eraUltimo = estado.nivel === NIVELES.length - 1;
  sonidoVictoria();
  particulas(innerWidth / 2, innerHeight / 2, ["✨", "⭐", "🎃", "🦇"], 26, 280);
  log("INFO", `fragmento ${estado.fragmentos}/${LARGO_CODIGO} de la llave descifrado`);
  if (eraUltimo) return pantallaFinNiveles();

  const progreso = estado.codigo.split("").map((d, i) =>
    `<div class="slot-g ${i < estado.fragmentos ? "" : "vacio"}">${i < estado.fragmentos ? d : "?"}</div>`).join("");
  mostrar(`
    <section class="tarjeta">
      <div class="grande">✅</div>
      <h1>¡Sala ${estado.nivel + 1} superada!</h1>
      <p>El Administrador te entrega un fragmento de la llave:</p>
      <div class="fragmento">🗝️ <span>${digito}</span></div>
      <div class="codigo-grande">${progreso}</div>
      <p><b>Anótalo.</b> En la puerta final, el código estará oculto.</p>
      <button class="btn" id="btn-sig">➡️ Seguir descendiendo</button>
    </section>
  `);
  document.getElementById("btn-sig").onclick = () => {
    estado.nivel++;
    pantallaIntro(NIVELES[estado.nivel], false);
  };
  decir(azar(ADMIN.fragmento));
}

function pantallaFinNiveles() {
  estado.tieneLlave = true;
  estado.ocultarCodigo = false;
  actualizarHUD();
  const prev = prepararJefe();
  const digitos = estado.codigo.split("").map(d => `<div class="slot-g">${d}</div>`).join("");
  mostrar(`
    <section class="tarjeta">
      <div class="llave">🗝️</div>
      <h1>¡Llave completa!</h1>
      <p>Descifraste los ${LARGO_CODIGO} fragmentos. El código de la puerta final es:</p>
      <div class="codigo-grande">${digitos}</div>
      <p><b>Anótalo o memorízalo.</b> Delante de la puerta, el sistema lo ocultará. Revelarlo cuesta una vida.</p>
      <div class="nota-corr">La mazmorra quedó <b>${NOMBRES_ETAPA[etapaDe(estado.corrupcion)].toLowerCase()}</b> (☣️ ${estado.corrupcion}%).<br>Al otro lado te esperan ${prev.extras > 0 ? `<b>${8 + prev.extras} preguntas</b>` : "<b>8 preguntas</b>"} y <b>${prev.tiempo} segundos</b>.</div>
      <button class="btn" id="btn-puerta">🚪 Ir a la Puerta del Infierno</button>
    </section>
  `);
  document.getElementById("btn-puerta").onclick = pantallaPuerta;
  decir(ADMIN.llaveCompleta, 6000);
}

/* ---------- La Puerta del Infierno: teclear el código ---------- */
function pantallaPuerta() {
  pararTemporizador();
  estado.enJefe = false;
  estado.ocultarCodigo = true;
  document.body.classList.remove("jefe");
  document.body.classList.add("puerta");
  actualizarHUD();

  let entrada = "";
  let intentos = INTENTOS_CODIGO;
  let fin = Date.now() + TIEMPO_PUERTA * 1000;
  let ultimoSeg = null;
  let terminado = false;
  let revelado = false;

  mostrar(`
    <section class="tarjeta puerta-card">
      <h2>🔥 ÚLTIMA PUERTA 🔥</h2>
      <h1>La Puerta del Infierno</h1>
      <svg class="puerta-svg" id="puerta-svg" viewBox="0 0 220 270" aria-hidden="true">
        <defs>
          <radialGradient id="brasa" cx="50%" cy="65%" r="75%">
            <stop offset="0" stop-color="#ff7a1a"/><stop offset=".55" stop-color="#a40000"/><stop offset="1" stop-color="#1a0000"/>
          </radialGradient>
          <radialGradient id="luzp" cx="50%" cy="60%" r="70%">
            <stop offset="0" stop-color="#fff3b0"/><stop offset=".5" stop-color="#ff7a00"/><stop offset="1" stop-color="#7a0000"/>
          </radialGradient>
        </defs>
        <path d="M14 262 V104 A96 96 0 0 1 206 104 V262 Z" fill="#0d0505" stroke="#5a0d10" stroke-width="7"/>
        <path class="luz-puerta" d="M26 262 V106 A84 84 0 0 1 194 106 V262 Z" fill="url(#luzp)"/>
        <g class="hoja izq">
          <path d="M26 262 V106 A84 84 0 0 1 110 22 V262 Z" fill="url(#brasa)" stroke="#2a0305" stroke-width="3"/>
          <circle cx="98" cy="190" r="5" fill="#d4a73a"/>
        </g>
        <g class="hoja der">
          <path d="M110 22 A84 84 0 0 1 194 106 V262 H110 Z" fill="url(#brasa)" stroke="#2a0305" stroke-width="3"/>
          <circle cx="122" cy="190" r="5" fill="#d4a73a"/>
        </g>
        <g class="cadenas" opacity=".85">
          <path d="M26 74 L194 206" stroke="#8a8a8a" stroke-width="5" stroke-dasharray="9 5"/>
          <path d="M194 74 L26 206" stroke="#8a8a8a" stroke-width="5" stroke-dasharray="9 5"/>
        </g>
        <g class="penta">
          <circle cx="110" cy="128" r="46" fill="none" stroke="#ffb199" stroke-width="2.5"/>
          <polygon transform="rotate(180 110 128)" points="110,86 134.7,162 70.1,115 149.9,115 85.3,162" fill="none" stroke="#ff4b4b" stroke-width="3" stroke-linejoin="round"/>
        </g>
      </svg>
      <div class="reloj-puerta">
        <div>⏳ <span id="t-puerta">${TIEMPO_PUERTA}</span> s</div>
        <div class="barra" style="max-width:320px;margin:4px auto"><div id="barra-puerta"></div></div>
      </div>
      <div class="slots-codigo" id="slots"></div>
      <p id="msg-puerta">Teclea el código de ${LARGO_CODIGO} dígitos. Intentos: ${INTENTOS_CODIGO}</p>
      <div class="teclado" id="teclado"></div>
      <button class="btn-mini" id="btn-revelar">👁️ Revelar el código (−1 vida, +${CORRUPCION_REVELAR}% ☣️)</button>
    </section>
  `);

  const $slots = document.getElementById("slots");
  const $msg = document.getElementById("msg-puerta");
  const $t = document.getElementById("t-puerta");
  const $barra = document.getElementById("barra-puerta");
  const $svg = document.getElementById("puerta-svg");
  const $teclado = document.getElementById("teclado");
  const $revelar = document.getElementById("btn-revelar");

  function pintar() {
    $slots.innerHTML = Array.from({ length: LARGO_CODIGO }, (_, i) => {
      const ch = entrada[i];
      return `<div class="dig ${i === entrada.length ? "activo" : ""}">${ch !== undefined ? ch : ""}</div>`;
    }).join("");
  }

  function pulsar(d) {
    if (terminado || entrada.length >= LARGO_CODIGO) return;
    entrada += d;
    sonidoTecla();
    pintar();
    if (entrada.length === LARGO_CODIGO) setTimeout(probar, 250);
  }
  function borrar() { if (terminado) return; entrada = entrada.slice(0, -1); pintar(); }
  function limpiar() { if (terminado) return; entrada = ""; pintar(); }

  ["1", "2", "3", "4", "5", "6", "7", "8", "9", "C", "0", "⌫"].forEach(t => {
    const b = document.createElement("button");
    b.className = "tecla";
    b.textContent = t;
    b.onclick = () => (t === "C" ? limpiar() : t === "⌫" ? borrar() : pulsar(t));
    $teclado.appendChild(b);
  });

  function probar() {
    if (terminado || entrada.length !== LARGO_CODIGO) return;
    if (entrada === estado.codigo) return abrir();
    intentos--;
    log("ERROR", `AccesoDenegadoException: código incorrecto (${intentos} intentos restantes)`);
    sonidoMal();
    activar("dano", 950);
    sacudirPantalla();
    entrada = "";
    pintar();
    if (intentos <= 0) {
      terminado = true;
      pararTemporizador();
      corromper(CORRUPCION_CODIGO, "código incorrecto");
      explotar({ tipo: "puerta" });
    } else {
      $msg.innerHTML = `❌ Código incorrecto. Intentos restantes: <b>${intentos}</b>`;
      decir(azar(ADMIN.codigoMal));
      corromper(CORRUPCION_CODIGO, "código incorrecto");
    }
  }

  function abrir() {
    terminado = true;
    pararTemporizador();
    $svg.classList.add("abierta");
    $msg.textContent = "🔓 ¡La puerta se abre!";
    sonidoPuerta();
    log("INFO", "Puerta del Infierno: ACCESS GRANTED");
    decir(azar(ADMIN.puertaAbre));
    setTimeout(() => {
      activar("rayo", 700);
      sacudirPantalla();
      particulas(innerWidth / 2, innerHeight / 2, ["🔥", "💀", "👹", "🩸"], 32, 320);
    }, 600);
    setTimeout(() => pantallaIntro(prepararJefe(), true), 2400);
  }

  $revelar.onclick = () => {
    if (terminado || revelado) return;
    revelado = true;
    $revelar.disabled = true;
    estado.vidas = Math.max(0, estado.vidas - 1);
    estado.ocultarCodigo = false;
    actualizarHUD();
    efectoDano($revelar);
    $msg.innerHTML = `👁️ El código es <b style="color:#ffe27a;letter-spacing:4px">${estado.codigo}</b>`;
    log("WARN", "código revelado a cambio de una vida");
    if (estado.vidas <= 0) {
      terminado = true;
      pararTemporizador();
      corromper(CORRUPCION_REVELAR, "pacto: revelar código");
      setTimeout(pantallaGameOver, 1100);
    } else {
      decir(azar(ADMIN.revelar));
      corromper(CORRUPCION_REVELAR, "pacto: revelar código");
    }
  };

  function tick() {
    const restante = fin - Date.now();
    $t.textContent = formatear(restante / 1000);
    $barra.style.width = Math.max(0, restante / (TIEMPO_PUERTA * 1000) * 100) + "%";
    const peligro = restante <= 10000;
    $t.classList.toggle("rojo", peligro);
    $barra.classList.toggle("rojo", peligro);
    document.body.classList.toggle("alerta", peligro);
    if (peligro) {
      const seg = Math.ceil(restante / 1000);
      if (seg !== ultimoSeg && seg > 0) { ultimoSeg = seg; sonidoTic(); }
    }
    if (restante <= 0 && !terminado) {
      terminado = true;
      pararTemporizador();
      explotar({ tipo: "puerta" });
    }
  }

  function teclado(e) {
    if (!document.body.contains($slots)) { document.removeEventListener("keydown", teclado); return; }
    if (e.key.length === 1 && e.key >= "0" && e.key <= "9") pulsar(e.key);
    else if (e.key === "Backspace") borrar();
  }
  document.addEventListener("keydown", teclado);

  pintar();
  tick();
  temporizador = setInterval(tick, 100);
  decir(azar(ADMIN.puerta));
}

/* ---------- Final ---------- */
function pantallaGameOver() {
  pararTemporizador();
  limpiarClasesEscena();
  estado.enJefe = false;
  estado.ocultarCodigo = false;
  actualizarHUD();
  log("ERROR", "GAME OVER");
  mostrar(`
    <section class="tarjeta game-over">
      <div class="grande">💀</div>
      <h1>GAME OVER</h1>
      <p>Tu alma se une a las demás en la mazmorra…</p>
      <div class="datos">
        <div class="dato">❌ Errores: ${estado.errores}</div>
        <div class="dato">💣 Bombas: ${estado.explosiones}</div>
        <div class="dato">☣️ Corrupción: ${estado.corrupcion}%</div>
      </div>
      <button class="btn" id="btn-de-nuevo">🔁 Intentarlo otra vez</button>
    </section>
  `);
  document.getElementById("btn-de-nuevo").onclick = () => {
    reiniciarEstado();
    pantallaIntro(NIVELES[0], false);
  };
  decir(azar(ADMIN.gameOver));
}

function pantallaVictoria() {
  pararTemporizador();
  limpiarClasesEscena();
  estado.enJefe = false;
  estado.ocultarCodigo = false;
  actualizarHUD();
  sonidoVictoria();
  const reg = cargarRegistro();
  reg.victorias = (reg.victorias || 0) + 1;
  reg.mejorCorrupcion = reg.mejorCorrupcion == null ? estado.corrupcion : Math.min(reg.mejorCorrupcion, estado.corrupcion);
  guardarRegistro(reg);
  log("INFO", "Puerta del Infierno derrotada · TROFEO DESBLOQUEADO");
  mostrar(`
    <section class="tarjeta">
      <div class="trofeo">🏆</div>
      <h1>¡Sobreviviste a la mazmorra!</h1>
      <p>Los tres sellos se rompieron y la maldición terminó. Ganaste el trofeo con las <b>dos piezas del rompecabezas</b>.</p>
      <svg class="rompecabezas" viewBox="-40 -10 280 120">
        <g class="pieza sep-izq" id="pieza1">
          <path d="M0 0 H100 V32 A19 19 0 1 1 100 68 V100 H0 Z" fill="#d9c9a6" stroke="#fff6dd" stroke-width="3" stroke-linejoin="round"/>
          <text class="pieza-texto" x="38" y="55">Pieza 1</text>
        </g>
        <g class="pieza sep-der" id="pieza2">
          <path d="M100 0 H200 V100 H100 V68 A19 19 0 1 0 100 32 Z" fill="#ff7a1a" stroke="#fff6dd" stroke-width="3" stroke-linejoin="round"/>
          <text class="pieza-texto" x="132" y="55">Pieza 2</text>
        </g>
      </svg>
      <div class="datos">
        <div class="dato">❌ Errores: ${estado.errores}</div>
        <div class="dato">💣 Bombas: ${estado.explosiones}</div>
        <div class="dato">☣️ Corrupción final: ${estado.corrupcion}%</div>
      </div>
      <p>🧩 ¡Únelas para completar el rompecabezas! 🧩</p>
      <button class="btn" id="btn-reiniciar">🔁 Jugar de nuevo</button>
    </section>
  `);
  setTimeout(() => {
    const p1 = document.getElementById("pieza1");
    const p2 = document.getElementById("pieza2");
    if (p1 && p2) { p1.classList.remove("sep-izq"); p2.classList.remove("sep-der"); }
  }, 1200);
  lluviaFestiva();
  document.getElementById("btn-reiniciar").onclick = pantallaInicio;
  decir(azar(ADMIN.victoria));
}

/* ---------- ¡A jugar! ---------- */
crearAmbiente();
iniciarEfectosGlobales();
aplicarCorrupcion();
pantallaInicio();
</script>
</body>
